name: MOSAIC browser logic QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check core.js
          node --check effects.js
          node --check patterns.js
          node --check soundbank.js
          node --check instruments.js
          node --check timeline.js
          node --check scenes.js
          node --check audio-loops.js
      - name: Tests
        run: node --test tests/*.test.js
